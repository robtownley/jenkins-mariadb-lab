# Read automatically because Jenkins runs ansible-playbook from the repository root.
[defaults]
# Default is 5; a REPLICA_COUNT of 2 already has 12 hosts. Plays with serial: 1 are unaffected.
forks = 30
# Reuse facts gathered earlier in the same build instead of re-gathering in every playbook.
# The cache lives in the workspace, which the Checkout stage wipes, so it never outlives a build.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible-facts
fact_caching_timeout = 3600
# Per-task timings in the console log, to show where the remaining time goes.
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# Send modules over the existing SSH session instead of copying a temp file per task.
pipelining = True
# Keep SSH connections open across stages and approval waits (Ansible's default is 60s).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=30m
