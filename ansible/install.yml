---
- name: Prepare all lab servers
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    lab_mariadb_version: "{{ lookup('ansible.builtin.env', 'LAB_MARIADB_VERSION') | default('11.4', true) }}"

  tasks:
    - name: Wait for SSH and Python
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 600

    - name: Wait for first-boot configuration to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Gather server facts
      ansible.builtin.setup:
      
    - name: Remove the previous combined repository configuration
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/mariadb.list
        state: absent
        
    - name: Install repository prerequisites and database Python driver
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
          - python3-pymysql
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Download verified MariaDB repository setup tool
      ansible.builtin.get_url:
        url: https://r.mariadb.com/downloads/mariadb_repo_setup
        dest: /usr/local/sbin/mariadb_repo_setup
        mode: "0755"
        checksum: "sha256:b54c87edfe81b9837ef44a4a4f39383dd8df32776e6a18c0743a5d3ece044ac3"

    - name: Configure only the MariaDB {{ lab_mariadb_version }} repository
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/mariadb_repo_setup
          - --mariadb-server-version=mariadb-{{ lab_mariadb_version }}
          - --skip-maxscale
          - --skip-tools
          - --list
      changed_when: true

- name: Install MariaDB on the database nodes
  hosts: database:multisource
  become: true
  any_errors_fatal: true
  vars:
    lab_mariadb_version: "{{ lookup('ansible.builtin.env', 'LAB_MARIADB_VERSION') | default('11.4', true) }}"

  tasks:
    - name: Read the installed MariaDB server package version
      ansible.builtin.command: dpkg-query -W -f=${Version} mariadb-server
      register: installed_mariadb
      changed_when: false
      failed_when: false

    - name: Refuse an in-place change of MariaDB series
      ansible.builtin.assert:
        that:
          - installed_mariadb.rc != 0 or installed_mariadb.stdout == '' or (':' ~ lab_mariadb_version ~ '.') in installed_mariadb.stdout
        fail_msg: >-
          {{ inventory_hostname }} runs MariaDB {{ installed_mariadb.stdout }} but MARIADB_VERSION is {{ lab_mariadb_version }}.
          In-place upgrades are not automated; choose the series the lab already runs.

    # A fresh node must refresh apt to see the repository added above;
    # an existing node on the requested series can reuse a recent package list.
    - name: Install MariaDB packages
      ansible.builtin.apt:
        name:
          - mariadb-server
          - mariadb-client
          - mariadb-backup
        state: present
        update_cache: true
        cache_valid_time: "{{ 3600 if installed_mariadb.rc == 0 and (':' ~ lab_mariadb_version ~ '.') in installed_mariadb.stdout else 0 }}"
        lock_timeout: 300

    - name: Enable and start MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        enabled: true
        state: started

    - name: Read the installed server version
      ansible.builtin.command:
        argv:
          - mariadb
          - --batch
          - --skip-column-names
          - --execute
          - SELECT VERSION();
      register: server_version
      changed_when: false

    - name: Confirm the requested MariaDB series is running
      ansible.builtin.assert:
        that:
          - server_version.stdout.startswith(lab_mariadb_version ~ '.')
        fail_msg: "Unexpected MariaDB version: {{ server_version.stdout }}"

    - name: Report database version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ server_version.stdout }}"

- name: Install MaxScale on the proxy
  hosts: proxy
  become: true
  any_errors_fatal: true
  vars:
    lab_mariadb_version: "{{ lookup('ansible.builtin.env', 'LAB_MARIADB_VERSION') | default('11.4', true) }}"

  tasks:
    - name: Read the installed MariaDB client package version
      ansible.builtin.command: dpkg-query -W -f=${Version} mariadb-client
      register: installed_client
      changed_when: false
      failed_when: false

    - name: Install database client and package prerequisites
      ansible.builtin.apt:
        name:
          - mariadb-client
          - xz-utils
        state: present
        update_cache: true
        cache_valid_time: "{{ 3600 if installed_client.rc == 0 and (':' ~ lab_mariadb_version ~ '.') in installed_client.stdout else 0 }}"
        lock_timeout: 300

    - name: Download the published MaxScale Ubuntu Noble package
      ansible.builtin.get_url:
        url: https://dlm.mariadb.com/4296969/MaxScale/24.02.6/apt/pool/main/m/maxscale/maxscale_24.02.6~noble-1_amd64.deb
        dest: /var/tmp/maxscale_24.02.6_noble_amd64.deb
        mode: "0644"

    - name: Install MaxScale with its dependencies
      ansible.builtin.apt:
        deb: /var/tmp/maxscale_24.02.6_noble_amd64.deb
        policy_rc_d: 101
        lock_timeout: 300

    - name: Read MaxScale version
      ansible.builtin.command: maxscale --version
      register: maxscale_version
      changed_when: false

    - name: Confirm MaxScale 24.02.6 is installed
      ansible.builtin.assert:
        that:
          - "'24.02.6' in maxscale_version.stdout"

    - name: Report proxy version
      ansible.builtin.debug:
        msg: "{{ maxscale_version.stdout }}"
