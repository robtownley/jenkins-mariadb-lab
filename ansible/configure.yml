---
- name: Configure MariaDB IDs and replication settings
  tags: [seed_plan]
  hosts: database
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Configure stable server IDs and replication settings
      ansible.builtin.copy:
        dest: /etc/mysql/mariadb.conf.d/60-lab.cnf
        owner: root
        group: root
        mode: "0644"
        content: |
          [mariadb]
          bind_address=0.0.0.0
          skip_name_resolve=1
          server_id={{ mariadb_server_id }}
          log_bin=/var/lib/mysql/mariadb-bin
          relay_log=/var/lib/mysql/mariadb-relay
          binlog_format=ROW
          log_slave_updates=1
          gtid_strict_mode=1
          gtid_domain_id=0
          read_only={{ 0 if inventory_hostname == 'primary' else 1 }}
          sync_binlog=1
          innodb_flush_log_at_trx_commit=1
          binlog_expire_logs_seconds=604800
          innodb_buffer_pool_size=512M
          max_connections=100
      notify: Restart MariaDB

    - name: Apply settings
      ansible.builtin.meta: flush_handlers

    - name: Enable and start MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        enabled: true
        state: started

  handlers:
    - name: Restart MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        state: restarted

- name: Create accounts and the demo database on the primary
  tags: [seed_plan]
  hosts: primary
  become: true
  any_errors_fatal: true
  vars_files:
    - secrets.yml
  tasks:
    - name: Confirm Jenkins supplied the expected passwords
      ansible.builtin.assert:
        that:
          - lab_repl_password is match('^[0-9a-fA-F]{32}$')
          - lab_monitor_password is match('^[0-9a-fA-F]{32}$')
          - lab_service_password is match('^[0-9a-fA-F]{32}$')
          - lab_app_password is match('^[0-9a-fA-F]{32}$')
        fail_msg: "Check the four Jenkins secret-text credentials."
      no_log: true

    - name: Create replication accounts for the current replica IPs
      community.mysql.mysql_user:
        login_unix_socket: /run/mysqld/mysqld.sock
        name: lab_repl
        host: "{{ hostvars[item].ansible_host }}"
        password: "{{ lab_repl_password }}"
        priv: "*.*:REPLICATION SLAVE"
        state: present
      loop: "{{ groups['replicas'] }}"
      no_log: true

    - name: Create the MaxScale monitoring account
      community.mysql.mysql_user:
        login_unix_socket: /run/mysqld/mysqld.sock
        name: lab_monitor
        host: "{{ hostvars['maxscale'].ansible_host }}"
        password: "{{ lab_monitor_password }}"
        priv: "*.*:REPLICA MONITOR"
        state: present
      no_log: true

    - name: Create the MaxScale authentication service account
      community.mysql.mysql_user:
        login_unix_socket: /run/mysqld/mysqld.sock
        name: lab_service
        host: "{{ hostvars['maxscale'].ansible_host }}"
        password: "{{ lab_service_password }}"
        priv:
          "mysql.*": "SELECT"
          "*.*": "SHOW DATABASES"
        state: present
      no_log: true

    - name: Create the demo database
      community.mysql.mysql_db:
        login_unix_socket: /run/mysqld/mysqld.sock
        name: lab
        state: present

    - name: Create the demo application account
      community.mysql.mysql_user:
        login_unix_socket: /run/mysqld/mysqld.sock
        name: lab_app
        host: "%"
        password: "{{ lab_app_password }}"
        priv: "lab.*:SELECT,INSERT,UPDATE,DELETE"
        state: present
      no_log: true

    - name: Create a table for pipeline verification
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: |
          CREATE TABLE IF NOT EXISTS lab.pipeline_checks (
            marker VARCHAR(200) PRIMARY KEY,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          )

- name: Configure and start MaxScale before seed donor selection
  tags: [seed_plan]
  hosts: proxy
  become: true
  any_errors_fatal: true
  vars_files:
    - secrets.yml
  tasks:
    - name: Write the dynamic MaxScale configuration
      ansible.builtin.template:
        src: templates/maxscale.cnf.j2
        dest: /etc/maxscale.cnf
        owner: root
        group: maxscale
        mode: "0640"
      no_log: true

    - name: Enable and start MaxScale
      ansible.builtin.systemd_service:
        name: maxscale
        enabled: true
        state: started

    - name: Wait for the database listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3306
        timeout: 60

    - name: Install MaxScale membership reconciler
      ansible.builtin.copy:
        src: files/reconcile_maxscale.py
        dest: /usr/local/sbin/reconcile-lab-maxscale
        mode: '0700'

    - name: Write direct-tier backend membership
      ansible.builtin.copy:
        dest: /etc/maxscale-lab-members.json
        mode: '0600'
        content: >-
          {{ dict((['primary'] + groups['intermediate_replicas']) | zip((['primary'] + groups['intermediate_replicas']) | map('extract', hostvars, 'ansible_host'))) | to_json }}

    - name: Reconcile runtime monitoring credentials
      ansible.builtin.command:
        argv: [maxctrl, alter, monitor, MariaDB-Monitor, user, lab_monitor, password, '{{ lab_monitor_password }}']
      no_log: true

    - name: Reconcile runtime service credentials
      ansible.builtin.command:
        argv: [maxctrl, alter, service, ReadWrite-Service, user, lab_service, password, '{{ lab_service_password }}']
      no_log: true

    - name: Reconcile monitoring membership without restarting MaxScale
      ansible.builtin.command: /usr/bin/python3 /usr/local/sbin/reconcile-lab-maxscale --phase monitor
      register: maxscale_members
      changed_when: "maxscale_members.stdout | trim == 'CHANGED'"

- name: Identify fresh replicas that need a backup seed
  tags: [seed_plan]
  hosts: replicas
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Inspect existing replication configuration
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: SHOW SLAVE STATUS
      register: existing_replication

    - name: Reject unexpected replication channels
      ansible.builtin.assert:
        that:
          - existing_replication.query_result[0] | length <= 1
        fail_msg: "Multi-source channels are outside this lab's seed procedure."

    - name: Confirm an existing channel points to its assigned upstream
      ansible.builtin.assert:
        that:
          - existing_replication.query_result[0][0].Master_Host == hostvars[replication_upstream].ansible_host
        fail_msg: "Replica points elsewhere; refusing automatic reconfiguration."
      when: existing_replication.query_result[0] | length > 0

    - name: Inspect application schemas on a fresh replica
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: |
          SELECT COUNT(*) AS database_count
          FROM information_schema.SCHEMATA
          WHERE SCHEMA_NAME NOT IN (
            'mysql', 'information_schema', 'performance_schema', 'sys'
          )
      register: existing_databases
      when: existing_replication.query_result[0] | length == 0

    - name: Only seed fresh replicas without application data
      ansible.builtin.assert:
        that:
          - existing_databases.query_result[0][0].database_count | int == 0
        fail_msg: "Unconfigured replica contains application data. Inspect it before reseeding."
      when: existing_replication.query_result[0] | length == 0

    - name: Add fresh replica to this run's seed targets
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        groups: seed_targets
      when: existing_replication.query_result[0] | length == 0

- import_playbook: seed_replicas.yml

- name: Grant child replication access locally on intermediate replicas
  hosts: intermediate_replicas
  become: true
  any_errors_fatal: true
  vars_files:
    - secrets.yml
  tasks:
    - name: Ensure each child can connect without creating local GTIDs
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query:
          - SET SESSION sql_log_bin = 0
          - "CREATE USER IF NOT EXISTS 'lab_repl'@'{{ hostvars[item].ansible_host }}' IDENTIFIED BY '{{ lab_repl_password }}'"
          - "ALTER USER 'lab_repl'@'{{ hostvars[item].ansible_host }}' IDENTIFIED BY '{{ lab_repl_password }}'"
          - "GRANT REPLICATION SLAVE ON *.* TO 'lab_repl'@'{{ hostvars[item].ansible_host }}'"
      loop: "{{ groups['downstream_replicas'] }}"
      when: hostvars[item].replication_upstream == inventory_hostname
      no_log: true

- name: Establish and verify current replica connections
  hosts: intermediate_replicas:downstream_replicas
  order: inventory
  become: true
  serial: 1
  any_errors_fatal: true
  vars_files:
    - secrets.yml
  tasks:
    - name: Inspect the replication channel
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: SHOW SLAVE STATUS
      register: channel

    - name: Write a post-seed GTID anchor on the primary
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: INSERT INTO lab.pipeline_checks (marker) VALUES (CONCAT('tier3-anchor-', UUID()))
      delegate_to: primary
      when: inventory_hostname in groups['downstream_replicas'] and channel.query_result[0] | length == 0

    - name: Read the primary position for downstream catchup
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: SELECT @@global.gtid_binlog_pos AS position
      delegate_to: primary
      register: downstream_anchor
      when: inventory_hostname in groups['downstream_replicas'] and channel.query_result[0] | length == 0

    - name: Wait until the intermediate has logged the post-seed anchor
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: SELECT MASTER_GTID_WAIT(%s, 120) AS wait_result
        positional_args:
          - "{{ downstream_anchor.query_result[0][0].position }}"
      delegate_to: "{{ replication_upstream }}"
      register: upstream_anchor_wait
      failed_when: upstream_anchor_wait.query_result[0][0].wait_result | int < 0
      when: inventory_hostname in groups['downstream_replicas'] and channel.query_result[0] | length == 0

    - name: Read applied seed GTID for a downstream replica
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: SELECT @@global.gtid_slave_pos AS position
      register: child_seed_position
      when: inventory_hostname in groups['downstream_replicas']

    - name: Wait for the assigned upstream to contain the downstream seed position
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: SELECT MASTER_GTID_WAIT(%s, 120) AS wait_result
        positional_args:
          - "{{ child_seed_position.query_result[0][0].position }}"
      delegate_to: "{{ replication_upstream }}"
      register: upstream_seed_wait
      failed_when: upstream_seed_wait.query_result[0][0].wait_result | int < 0
      when: inventory_hostname in groups['downstream_replicas']

    - name: Configure a seeded replica using its backup GTID position
      community.mysql.mysql_replication:
        login_unix_socket: /run/mysqld/mysqld.sock
        mode: changeprimary
        primary_host: "{{ hostvars[replication_upstream].ansible_host }}"
        primary_user: lab_repl
        primary_password: "{{ lab_repl_password }}"
        primary_port: 3306
        primary_use_gtid: replica_pos
      when: channel.query_result[0] | length == 0
      no_log: true

    - name: Start replication
      community.mysql.mysql_replication:
        login_unix_socket: /run/mysqld/mysqld.sock
        mode: startreplica

    - name: Wait for replication to catch up
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: SHOW SLAVE STATUS
      register: replication_status
      until:
        - replication_status.query_result[0] | length == 1
        - replication_status.query_result[0][0].Slave_IO_Running == 'Yes'
        - replication_status.query_result[0][0].Slave_SQL_Running == 'Yes'
        - replication_status.query_result[0][0].Seconds_Behind_Master is not none
        - replication_status.query_result[0][0].Seconds_Behind_Master | int == 0
      retries: 60
      delay: 5

    - name: Report replication health
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: IO=Yes, SQL=Yes, lag=0"

- name: Test a write through the configured proxy
  hosts: proxy
  become: true
  any_errors_fatal: true
  vars_files:
    - secrets.yml
  tasks:
    - name: Link healthy direct-tier replicas to the application service
      ansible.builtin.command: /usr/bin/python3 /usr/local/sbin/reconcile-lab-maxscale --phase route
      register: maxscale_routing
      changed_when: "maxscale_routing.stdout | trim == 'CHANGED'"

    - name: Insert this build's marker through MaxScale
      community.mysql.mysql_query:
        login_host: 127.0.0.1
        login_port: 3306
        login_user: lab_app
        login_password: "{{ lab_app_password }}"
        config_file: ""
        query: |
          INSERT INTO lab.pipeline_checks (marker)
          VALUES (%s)
          ON DUPLICATE KEY UPDATE marker = VALUES(marker)
        positional_args:
          - "{{ lab_test_marker }}"
      register: proxy_write
      until: proxy_write is succeeded
      retries: 30
      delay: 2
      no_log: true

    - name: Report successful proxy write
      ansible.builtin.debug:
        msg: "Write through MaxScale succeeded: {{ lab_test_marker }}"

- name: Verify the proxy write reached every database node
  hosts: database
  become: true
  any_errors_fatal: true
  vars_files:
    - secrets.yml
  tasks:
    - name: Wait for the build marker
      community.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: |
          SELECT COUNT(*) AS marker_count
          FROM lab.pipeline_checks
          WHERE marker = %s
        positional_args:
          - "{{ lab_test_marker }}"
      register: marker_result
      until: marker_result.query_result[0][0].marker_count | int == 1
      retries: 30
      delay: 2

    - name: Report verified data
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} contains {{ lab_test_marker }}"

- name: Remove successful transient seed backups
  hosts: primary:seed_targets
  become: true
  any_errors_fatal: true
  tasks:
    - name: Remove primary seed workspace
      ansible.builtin.file:
        path: /data/backup_source/.jenkins-seed-current
        state: absent
      delegate_to: "{{ hostvars['primary'].seed_source | default('primary') }}"
      when: inventory_hostname == 'primary' and groups.get('seed_targets', []) | length > 0

    - name: Remove replica seed workspace
      ansible.builtin.file:
        path: /var/tmp/.jenkins-seed-current
        state: absent
      when: inventory_hostname != 'primary'

    - name: Remove the successful run's donor snapshot
      ansible.builtin.command:
        argv: [zfs, destroy, -r, "{{ hostvars['primary'].seed_manifest.snapshot }}"]
      delegate_to: "{{ hostvars['primary'].seed_source | default('primary') }}"
      when:
        - inventory_hostname == 'primary'
        - groups.get('seed_targets', []) | length > 0
        - hostvars['primary'].seed_manifest.method | default('') == 'zfs'
